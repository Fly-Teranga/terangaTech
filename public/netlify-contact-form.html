<!doctype html>
<html lang="fr">
  <head><meta charset="utf-8"><title>Contact</title></head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <input type="hidden" name="subject" value="Nouvelle demande de démo FakiAirline">
      <p hidden><label>Ne pas remplir ce champ <input name="bot-field"></label></p>
      <input name="firstName" type="text">
      <input name="lastName" type="text">
      <input name="company" type="text">
      <input name="role" type="text">
      <input name="email" type="email">
      <input name="phone" type="tel">
      <select name="module"><option value="">Sélectionner un module</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
